<app-navigation [projectsAvailable]="(curriculum()?.proyectos?.length ?? 0) > 0" />

<main class="main">
  @if (loading()) {
    <div class="loading-state" role="status" aria-live="polite">
      <span class="spinner-border text-success" aria-hidden="true"></span>
      <span>Cargando el currículum…</span>
    </div>
  } @else if (loadError()) {
    <div class="load-error" role="alert">
      <h1>No se pudo cargar el currículum</h1>
      <p>{{ loadError() }}</p>
      <button class="btn btn-success" type="button" (click)="loadCurriculum()">Reintentar</button>
    </div>
  } @else if (curriculum(); as cv) {
    <app-home-section [cv]="cv" />
    <app-about-section [cv]="cv" />
    <app-resume-section [cv]="cv" />
    <app-objectives-section [cv]="cv" />
    <app-gallery-section />
    @if (cv.proyectos.length > 0) {
      <app-projects-section [projects]="cv.proyectos" />
    }
    <app-contact-section [cv]="cv" />
  }
</main>

<footer id="footer" class="footer">
  <div class="container">
    <p class="mb-1">© {{ currentYear }} Ruth Serrano Nina</p>
    <p class="credits mb-0">
      Plantilla <a href="https://bootstrapmade.com/iportfolio-bootstrap-portfolio-websites-template/" target="_blank" rel="noopener noreferrer">iPortfolio</a>
      por <a href="https://bootstrapmade.com/" target="_blank" rel="noopener noreferrer">BootstrapMade</a>.
      <a href="https://bootstrapmade.com/license/" target="_blank" rel="noopener noreferrer">Licencia y créditos</a>.
    </p>
  </div>
</footer>

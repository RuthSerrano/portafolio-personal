<section id="contact" class="contact section light-background">
  <div class="container section-title">
    <h2>Contacto</h2>
    <p>Escríbeme por correo electrónico.</p>
  </div>

  <div class="container">
    <div class="info-wrap">
      <div class="info-item">
        <i class="bi bi-envelope" aria-hidden="true"></i>
        <div>
          <h3>Correo electrónico</h3>
          <p><a [href]="'mailto:' + cv().correo">{{ cv().correo }}</a></p>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="projects" class="section">
  <div class="container section-title">
    <h2>Proyectos</h2>
    <p>Proyectos incluidos en el currículum.</p>
  </div>

  <div class="container">
    <div class="row gy-4">
      @for (project of projects(); track project.nombre) {
        <article class="col-md-6">
          <div class="p-4 h-100 border rounded bg-white">
            <h3>{{ project.nombre }}</h3>
            <p>{{ project.descripcion }}</p>
            @if (project.enlace) {
              <a [href]="project.enlace" target="_blank" rel="noopener noreferrer">
                Ver proyecto <span class="visually-hidden">: {{ project.nombre }}</span>
              </a>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
